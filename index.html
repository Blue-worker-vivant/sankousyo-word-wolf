<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  
  <link rel="stylesheet" href="style.css">
  
  <title>参考書ワードウルフ 〜おのたやはみそお〜 ver.0.3.0</title>
</head>
<body>
  <h1>📚参考書ワードウルフ<br>
      〜おのたやはみそお〜
  </h1>
  <p>すけえっすスタート！</p>
  <div id="start-screen">

  <h2>人数を選択してくださいさだかん</h2>
  
<label for="players">人数</label>

<select id="players">
  <option>3人</option>
  <option>4人</option>
  <option selected>5人</option>
  <option>6人</option>
  <option>7人</option>
  <option>8人</option>
  <option>9人</option>
  <option>10人</option>
</select>

<br><br>

<button onclick="goWolfSelect()">すけえっすをおっぱじめる</button>
  </div>

<div id="wolf-screen" style="display:none;">
  <h2>おのたやの人数を選択して欲しいよお</h2>
  <select id="wolf-count"></select>
  <p id="people-info"></p>

  <button onclick="goSubjectSelect()">次へ</button>
</div>

<div id="subject-screen" style="display:none;">
  <h2>参考書の科目をどう選ぶんだあ</h2>

  <label>
    <input type="radio" name="subject-mode" value="self" checked>
    自分で選択
  </label>
  <br><br>
  <label>
    <input type="radio" name="subject-mode" value="auto">
    おまかせ
  </label>
  <br><br>
  <button onclick="goDifficultySelect()">次へ</button>
</div>

<div id="difficulty-screen" style="display:none;">
  <h2>難易度をどう選びますか？</h2>
  <label>
    <input type="radio" name="difficulty-mode" value="self" checked >
    自分で選択
  </label>

  <br><br>

  <label>
    <input type="radio" name="difficulty-mode" value="auto">
    おまかせ
  </label>

  <br><br>

  <button onclick="goNext()">次へ</button>
</div>

  <p>ver.0.3.0</p >

  <script src="script.js"></script>
</body>
</html>
